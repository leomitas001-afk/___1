ass="btn secondary" data-action="import">Импорт JSON</button><button class="btn danger" data-action="reset">Сброс</button></div><input class="file-input" id="import-file" type="file" accept="application/json,.json"><details class="detail"><summary>Проверить правила</summary><button class="btn plain" data-action="selftest">Запустить selfTest()</button></details>${S.tests?`<ul class="list">${S.tests.map(x=>`<li>${x.ok?'Пройдено':'Не пройдено'}: ${esc(x.name)}${x.info?' · '+esc(x.info):''}</li>`).join('')}</ul>`:''}</div>`}
    function modal(html){S.modal=html;$('modal-root').innerHTML=html?`<div class="modal-layer" data-action="close"><div class="modal" role="dialog" aria-modal="true" aria-label="Детали">${html}<div class="actions"><button class="btn secondary wide" data-action="close">Закрыть</button></div></div></div>`:''}
    function render(){let tabs={today,week,shop,year,settings};$('app').innerHTML=`<header class="top"><div class="brand">ТИХАЯ КУХНЯ</div><span class="top-date">${UTIL.fmt(UTIL.today(),{day:'numeric',month:'short'})}</span></header>${!DATA?'<div class="notice error">Данные не подключены. Вставьте объект DATA в index.html, заменив /*__DATA__*/ null. Пока подбор недоступен.</div>':''}${S.storageError?'<div class="notice error">Память браузера недоступна. Экспортируйте данные перед закрытием.</div>':''}${tabs[S.tab]()} `;$('nav').innerHTML=`<div class="bar-inner">${[['today','Сегодня','◉'],['week','Неделя','▤'],['shop','Покупки','◈'],['year','Год','⌁'],['settings','Настройки','⚙']].map(([id,label,icon])=>`<button class="tab ${S.tab===id?'active':''}" data-action="go" data-tab="${id}" aria-label="${label}" ${S.tab===id?'aria-current="page"':''}><b aria-hidden="true">${icon}</b>${label}</button>`).join('')}</div>`;modal(S.modal)}
    function message(text){modal(`<h2>Обратите внимание</h2><p>${esc(text)}</p>`)}
    function setSetting(k,v){let structural=['start_date','shopping_day_0','shopping_day_1','weekends','has_steamer','excluded'];let s=S.settings;if(k.startsWith('shopping_day_')){let a=[...s.shopping_days];a[Number(k.at(-1))]=Number(v);if(a[0]===a[1])return message('Дни покупок должны различаться.');s.shopping_days=a}
      else if(k.startsWith('meal_time_'))s.meal_times[Number(k.at(-1))]=v;
      else if(k==='excluded')s.excluded=v.split(',').map(x=>x.trim()).filter(Boolean);
      else if(['portions','can_g'].includes(k)){if(Number(v)<1)return message('Укажите положительное число.');s[k]=Number(v)}else s[k]=v;
      if(structural.includes(k)){S.periods={};S.inventory={};S.offerPage={};}S.revision++;S.offers={};STATE.save();render();
    }
    function act(action,el){let p=E.periods(S.settings).find(x=>x.id===el.dataset.period)||activePeriod(),plan=S.periods[p?.id],id=el.dataset.id;
      if(action==='go'){S.tab=el.dataset.tab;render();return}
      if(action==='close'){modal(null);return}
      if(action==='more'){S.offerPage[p.id]=(S.offerPage[p.id]||0)+1;S.revision++;S.offers={};STATE.save();render();return}
      if(action==='select'){let offer=offers(p)[Number(el.dataset.index)];if(!offer)return message('Этот вариант недоступен.');STATE.change(s=>{s.periods[p.id]={...structuredClone(offer),bought:false,checked:{}}});return}
      if(action==='check'){plan.checked[id]=el.checked;STATE.save();return}
      if(action==='buy'){let rows=E.shopping(plan,S.settings,S.inventory),unchecked=rows.filter(x=>!plan.checked?.[x.id]);if(unchecked.length)return message('Сначала отметьте купленные продукты или нажмите «Не нашла» для замены.');STATE.change(s=>{rows.forEach(x=>s.inventory[x.id]=(s.inventory[x.id]||0)+x.need);plan.bought=true;plan.meals.forEach(x=>x.status='bought')});return}
      if(action==='missing'){let subs=E.ingredients[id]?.substitutes||[];let choices=subs.map(x=>typeof x==='string'?x:x.id).filter(x=>E.ingredients[x]);modal(`<h2>Не нашла: ${esc(E.ingredients[id]?.name||id)}</h2><p>Чтобы не нарушить КБЖУ и частоты белка, блюдо заменяется целиком. Недоступный продукт будет исключён из подбора.</p>${choices.map(x=>`<p>Замена из данных: ${esc(E.ingredients[x].name||x)}</p>`).join('')||'<p>В данных нет замен для продукта.</p>'}<button class="btn" data-action="reroll" data-id="${esc(id)}" data-period="${p.id}">Подобрать без этого продукта</button>`);return}
      if(action==='reroll'){modal(null);STATE.change(s=>{s.settings.excluded=[...new Set([...s.settings.excluded,id])];delete s.periods[p.id];s.offerPage[p.id]=(s.offerPage[p.id]||0)+1});return}
      if(action==='inventory'){modal(`<h2>Остатки</h2><p>Укажите граммы на руках. После приготовления расход спишется.</p>${Object.values(E.ingredients).map(x=>`<div class="field"><label>${esc(x.name||x.id)}</label><input type="number" min="0" value="${Math.round(S.inventory[x.id]||0)}" data-inventory="${esc(x.id)}"></div>`).join('')}<button class="btn wide" data-action="save-inventory">Сохранить</button>`);return}
      if(action==='save-inventory'){let values=[...document.querySelectorAll('[data-inventory]')].map(x=>[x.dataset.inventory,Math.max(0,Number(x.value)||0)]);modal(null);STATE.change(s=>{s.inventory=Object.fromEntries(values)});return}
      if(action==='cooked'){let m=plan?.meals.find(x=>x.date===el.dataset.date&&x.slot===Number(el.dataset.slot));if(!m||!plan.bought)return message('Сначала завершите покупки для этого периода.');STATE.change(s=>{m.status='cooked';for(let kind of ['main','side','veg'])for(let r of E.refs(E.item(kind,m[kind])))s.inventory[r.id]=Math.max(0,(s.inventory[r.id]||0)-Number(r.g||0)*s.settings.portions);if(m.slot===1)for(let r of E.refs(E.item('fruit',plan.fruits[m.date])))s.inventory[r.id]=Math.max(0,(s.inventory[r.id]||0)-Number(r.g||0)*s.settings.portions)});return}
      if(action==='move'||action==='replace'){let m=plan?.meals.find(x=>x.date===el.dataset.date&&x.slot===Number(el.dataset.slot));if(!m||m.status==='cooked')return;if(action==='move'){
          let next=UTIL.add(m.date,1),other=plan.meals.find(x=>x.date===next&&x.slot===m.slot);if(!other)return message('На завтра нет соответствующего приёма в этом периоде. Используйте замену.');
          let trial=structuredClone(plan.meals),a=trial.find(x=>x.date===m.date&&x.slot===m.slot),b=trial.find(x=>x.date===next&&x.slot===m.slot);[a.main,b.main]=[b.main,a.main];[a.side,b.side]=[b.side,a.side];[a.veg,b.veg]=[b.veg,a.veg];[a.grain,b.grain]=[b.grain,a.grain];[a.protein,b.protein]=[b.protein,a.protein];
          if(!E.validatePlan([...pastMeals(p),...trial],S.settings))return message('Перенос нарушает ограничения. Попробуйте заменить блюдо.');
          STATE.change(s=>{plan.meals=trial;plan.checked={};if(plan.bought)plan.bought=false});return;
        }
        let replacement=E.choose(p,S.settings,pastMeals(p),UTIL.hash(p.id+S.revision+'replace'));if(!replacement)return message('Допустимая замена не найдена. Существующий план сохранён.');
        modal(`<h2>Заменить период?</h2><p>Чтобы сохранить ограничения, будет пересчитан весь период. Купленные продукты останутся в остатках.</p><button class="btn wide" data-action="confirm-replace" data-period="${p.id}">Пересчитать</button>`);return}
      if(action==='confirm-replace'){let replacement=E.choose(p,S.settings,pastMeals(p),UTIL.hash(p.id+S.revision+'replace'));if(!replacement)return message('Допустимая замена не найдена.');modal(null);STATE.change(s=>{s.periods[p.id]={...replacement,bought:false,checked:{}}});return}
      if(action==='period-detail'){modal(`<h2>Период · ${UTIL.fmt(p.start)}</h2><p>${plan?'Закреплённый набор':'Предварительная структура. Детали будут рассчитаны перед покупкой.'}</p>${plan?plan.meals.map(x=>`<p>${caption(x.date)} · ${name('main',x.main)} / ${name('side',x.side)} · ${statusName(x.status)}</p>`).join(''):'<p>Белки и крупы появятся здесь после выбора набора.</p>'}`);return}
      if(action==='day-detail'){let d=el.dataset.date,per=E.periods(S.settings).find(x=>x.start<=d&&x.end>=d),q=S.periods[per?.id];modal(`<h2>${caption(d)}</h2>${q?.meals.filter(x=>x.date===d).map(x=>`<p>${name('main',x.main)} · ${name('side',x.side)} · ${name('veg',x.veg)}</p>`).join('')||'<p>Предварительный день. Выберите набор, чтобы увидеть блюда.</p>'}`);return}
      if(action==='export'){let blob=new Blob([JSON.stringify({version:1,settings:S.settings,periods:S.periods,inventory:S.inventory,revision:S.revision,offerPage:S.offerPage},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tihaya-kuhnya.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}
      if(action==='import'){$('import-file').click();return}
      if(action==='reset'){modal('<h2>Сбросить всё?</h2><p>Планы, покупки и остатки будут удалены.</p><button class="btn danger wide" data-action="confirm-reset">Удалить данные</button>');return}
      if(action==='confirm-reset'){try{localStorage.removeItem(STATE.key)}catch(e){}location.reload();return}
      if(action==='selftest'){S.tests=selfTest();render();return}
    }
    document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='close'&&e.target.closest('.modal')&&e.target!==el)return;act(el.dataset.action,el)});
    document.addEventListener('change',e=>{let el=e.target;if(el.dataset.setting){setSetting(el.dataset.setting,el.type==='checkbox'?el.checked:el.value)}else if(el.id==='import-file'&&el.files[0]){el.files[0].text().then(t=>{let v=JSON.parse(t);if(v.version!==1||!v.settings||!v.periods||!v.inventory)throw Error('Неверный формат копии');STATE.change(s=>{s.settings={...STATE.defaults,...v.settings};s.periods=v.periods;s.inventory=v.inventory;s.offerPage=v.offerPage||{};s.revision=Number(v.revision)||0});message('Копия загружена.')}).catch(err=>message('Импорт не выполнен: '+err.message))}});
    return {render,message};
  })();

  function selfTest(){let E=ENGINE,s={...STATE.defaults,has_steamer:false,weekends:true,start_date:UTIL.monday(UTIL.today())},periods=E.periods(s).filter(p=>UTIL.diff(p.start,s.start_date)<56),all=[],plans=[],errors=[],check=(name,ok,info='')=>errors.push({name,ok,info});
    if(!DATA){check('Данные подключены',false,'вставьте DATA');return errors}
    for(let p of periods){let plan=E.choose(p,s,all,UTIL.hash('selftest'+p.id));if(!plan){check('Подбор на 8 недель',false,`Нет решения для ${p.id}`);return errors}plans.push([p,plan]);all.push(...plan.meals)}
    let text=all.flatMap(x=>['main','side','veg'].map(k=>{let q=E.item(k,x[k]);return `${q?.name||''} ${q?.steps||''}`})).join(' ').toLowerCase();check('Нет свинины и жарки',!/свинин|свинина|pork|жар(ить|ка|ен|ить)|обжар/i.test(text));
    let day=s.start_date,last=UTIL.add(day,55),weekOK=true,grainOK=true,legOK=true;for(let d=day;UTIL.diff(last,d)>=6;d=UTIL.add(d,7)){let w=all.filter(x=>x.date>=d&&x.date<=UTIL.add(d,6));let fish=w.filter(x=>E.flags(E.item('main',x.main)).fish).length;weekOK&&=fish>=1&&fish<=2;legOK&&=w.filter(x=>['lentil','mung','chickpea','beans'].includes(x.grain)).length>=3}
    for(let d=day;UTIL.diff(last,d)>=13;d=UTIL.add(d,1)){let set=new Set(all.filter(x=>x.date>=d&&x.date<=UTIL.add(d,13)).map(x=>x.grain));grainOK&&=E.groups.every(g=>set.has(g))}
    check('Рыба 1-2 раза в каждую неделю',weekOK);for(let [label,key,gap] of [['Печень: 14 дней','liver',14],['Сердца: 30 дней','hearts',30],['Рыбный фарш: 30 дней','fishmince',30],['Казылык: 21 день','kazylyk',21]]){let a=all.filter(x=>E.flags(E.item('main',x.main))[key]);check(label,a.every((x,i)=>!i||UTIL.diff(x.date,a[i-1].date)>=gap))}
    let proteins=[...new Set(all.map(x=>x.protein))],proteinOK=proteins.every(p=>{let days=[...new Set(all.filter(x=>x.protein===p).map(x=>x.date))];return days.every((d,i)=>i<2||!(UTIL.diff(d,days[i-1])===1&&UTIL.diff(days[i-1],days[i-2])===1))});check('Нет одного белка 3 дня подряд',proteinOK);
    check('Нет одной крупы в соседних приёмах',all.every((x,i)=>!i||x.grain!==all[i-1].grain));check('Все группы круп за 14 дней',grainOK);check('Бобовые от 3 раз в неделю',legOK);
    check('КБЖУ каждого приёма',all.every(x=>{let n=E.nutrition([x.main,x.side,x.veg]);return n.kcal>=700&&n.kcal<=850&&n.p>=45&&n.p<=55}));
    check('Все id продуктов существуют',plans.every(([,p])=>[...p.meals.flatMap(x=>['main','side','veg'].flatMap(k=>E.refs(E.item(k,x[k])))),...Object.values(p.fruits).flatMap(id=>E.refs(E.item('fruit',id)))].every(r=>!!E.ingredients[r.id])));
    check('Исключённые продукты не попадают в покупки',plans.every(([,p])=>E.shopping(p,s,{}).every(x=>!['water','salt','black_pepper','bay_leaf'].includes(x.id))));
    return errors;
  }

  // Manifest и иконка встроены; для настоящего офлайн-кеша Safari нужен отдельный service worker.
  const icon='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180"><rect width="180" height="180" rx="38" fill="#244d38"/><path d="M45 106c0 29 17 44 45 44s45-15 45-44H45zm0-12h90M72 73c-12-16 13-20 1-38m29 38c-12-16 13-20 1-38" fill="none" stroke="#f4f2eb" stroke-width="9" stroke-linecap="round"/></svg>';
  const iconURL='data:image/svg+xml,'+encodeURIComponent(icon),manifest={name:'Тихая кухня',short_name:'Кухня',start_url:location.href.split('#')[0],display:'standalone',background_color:'#f4f2eb',theme_color:'#244d38',icons:[{src:iconURL,sizes:'180x180',type:'image/svg+xml',purpose:'any maskable'}]};
  for(let [rel,href] of [['apple-touch-icon',iconURL],['icon',iconURL],['manifest','data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest))]]){let l=document.createElement('link');l.rel=rel;l.href=href;document.head.append(l)}
  UI.render();
